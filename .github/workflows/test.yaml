name: test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: vscode-ant
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ant-src/ant
          path: ant
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: install
        working-directory: vscode-ant
        run: npm ci
      - name: compile
        working-directory: vscode-ant
        run: npm run compile
      - name: grammar
        working-directory: vscode-ant
        run: npm test
      - name: integration
        working-directory: vscode-ant
        run: xvfb-run -a npm run test:integration
      - name: package
        working-directory: vscode-ant
        run: npx @vscode/vsce package -o ant.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: ant.vsix
          path: vscode-ant/ant.vsix
